<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Main CSS -->
    <link rel="stylesheet" href="./style.css">
    <title>Student Management System</title>
</head>
<body>
    <!-- Student Information Container -->
    <div class="student-info-box py-3">
        <!-- Header -->
        <div class="header-info container text-center">
            <h1 class="title d-flex align-items-center justify-content-center me-2"><i class="fa-solid fa-user text-primary"></i>Student Information</h1>
            <p class="mb-4">Add, Update and Manage Student Information</p>
            <div id="messageDisplay"></div>
        </div>

        <!-- Input Information container -->
        <div class="input-info container">
            <form class="student-form row">

                <!-- Full Name -->
                <div class="col-md-4 py-4">
                    <label for="fullName" class="form-label pt-2">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter full Name" required>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="col-md-4 py-4">
                    <label for="email" class="form-label pt-2">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="text" class="form-control" id="email" placeholder="Enter Email Address" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="col-md-4 py-4">
                    <label for="phoneNumber" class="form-label pt-2">Phone Number</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input type="text" class="form-control" id="phoneNumber" placeholder="Enter Phone Number" required>
                    </div>
                </div>

                <!-- Department -->
                <div class="col-md-4 pb-4">
                    <label for="department" class="form-label pt-2">Department</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-building-columns"></i></i></span>
                        <select class="form-select" name="" id="department">
                            <option value="" selected>Select Department</option>
                            <option value="Information System">Information System</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Software Engineer">Software Engineer</option>
                            <option value="Computer Science">Computer Science</option>
                        </select>
                    </div>
                </div>

                <!-- Address -->
                <div class="col-md-4 pb-4">
                    <label for="address" class="form-label pt-2">Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                        <input type="text" class="form-control" id="address" placeholder="Enter Address" required>
                    </div>
                </div>

                <!-- Gender -->
                <div class="col-md-4 pb-4">
                    <label for="gender" class="form-label pt-2">Gender</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user-group"></i></span>
                        <select class="form-select" name="" id="gender"> 
                            <option value="" selected>Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div> 

                <!-- buttons -->
                 <div class="d-flex justify-content-center pb-4 gap-3">
                    <div class="input-group w-auto">
                        <span class="input-group-text btn bg-primary text-white"><i class="fa-solid fa-floppy-disk"></i></span>
                        <button type="submit" class="btn btn-primary">Save Student</button>
                    </div>
                    <div class="input-group w-auto">
                        <span class="input-group-text btn border border-end-0"><i class="fa-solid fa-arrows-rotate"></i></span>
                        <button type="reset" id="reset" class="btn border border-start-0">Reset</button>
                    </div>
                 </div>
            </form>
        </div>

    </div>

    <!-- Student List container -->
     <div class="student-list-box">
        <!-- Header -->
        <div class="title text-primary ms-3">
            <h5 class="fw-bold"><span class="me-2"><i class="fa-solid fa-user-group"></i></span>Student List</h5>
        </div>

        <!-- Student List Table -->
        <div class="table-box table-responsive-md m-3">
            <table class="table table-borderedless">
                <thead class="table-success">
                    <tr class="text-center">
                        <th scope="col">#</th>
                        <th scope="col">Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Department</th>
                        <th scope="col">Phone</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody class="table-group-divider text-center" id="tableBody">
                    
                </tbody>
            </table>
            <div class="text-center py-2"><p id="studentNumber"></p></div>
            
        </div>

     </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
     <script src="./script.js"></script>
</body>
</html>
